<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Expense Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .chat-header {
            padding: 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
        }
        .agent {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
        }
        .chat-input-area {
            display: flex;
            padding: 16px;
            border-top: 1px solid #334155;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        button {
            padding: 10px 18px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Ambient Expense Agent</div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="e.g., Claimed $150 for printer ink..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputElem = document.getElementById('userInput');
        const text = inputElem.value.trim();
        if (!text) return;

        appendMessage('user', text);
        inputElem.value = '';

        try {
            const response = await fetch('http://127.0.0.1:8080/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            
            // Render agent response text
            const reply = data.text || JSON.stringify(data, null, 2);
            appendMessage('agent', reply);
        } catch (err) {
            appendMessage('agent', 'Error connecting to local server.');
        }
    }

    function appendMessage(sender, text) {
        const box = document.getElementById('messages');
        const msgElem = document.createElement('div');
        msgElem.className = `message ${sender}`;
        msgElem.innerText = text;
        box.appendChild(msgElem);
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
